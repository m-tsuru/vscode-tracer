<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <style>
        body { padding: 0; margin: 0; height: 100vh; display: flex; flex-direction: column; }
        .container { display: flex; flex: 1; overflow: hidden; }

        /* 履歴パネル（左側） */
        .history-panel {
            width: 300px;
            border-right: 1px solid var(--vscode-panel-border);
            display: flex;
            flex-direction: column;
        }

        /* 差分ビューア（右側） */
        .diff-viewer {
            flex: 1;
            display: flex;
            flex-direction: column;
            background-color: var(--vscode-editor-background);
        }

        header {
            padding: 10px;
            border-bottom: 1px solid var(--vscode-panel-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .diff-content {
            flex: 1;
            overflow: auto;
            font-family: var(--vscode-editor-font-family);
            font-size: var(--vscode-editor-font-size);
            padding: 10px;
        }

        /* 簡易的なDiffの行スタイル */
        .diff-line.add { background-color: var(--vscode-diffEditor-insertedTextBackground); }
        .diff-line.del { background-color: var(--vscode-diffEditor-removedTextBackground); }
    </style>
</head>
<body>

    <div class="container">
        <aside class="history-panel">
            <header>
                <span>ローカル履歴</span>
                <vscode-button appearance="icon" aria-label="Refresh">
                    <vscode-icon name="refresh"></vscode-icon>
                </vscode-button>
            </header>

            <vscode-table id="history-table">
                <vscode-table-header slot="header">
                    <vscode-table-header-cell>日時</vscode-table-header-cell>
                    <vscode-table-header-cell>変更サイズ</vscode-table-header-cell>
                </vscode-table-header>
                <vscode-table-body>
                    <vscode-table-row>
                        <vscode-table-cell>2024/05/20 14:30</vscode-table-cell>
                        <vscode-table-cell>+12 -5</vscode-table-cell>
                    </vscode-table-row>
                </vscode-table-body>
            </vscode-table>
        </aside>

        <main class="diff-viewer">
            <header>
                <span>差分プレビュー: <code>extension.ts</code></span>
                <vscode-button id="commit-btn" appearance="primary">
                    この差分のみコミット
                </vscode-button>
            </header>

            <div class="diff-content" id="diff-display">
                <div class="diff-line del">- old code line</div>
                <div class="diff-line add">+ new code line</div>
                <div class="diff-line">  unchanged line</div>
            </div>
        </main>
    </div>

    <script type="module" src="https://unpkg.com/vscode-elements/dist/vscode-elements.js"></script>
    <script>
        const vscode = acquireVsCodeApi();

        // 履歴行をクリックした時の処理など
        document.getElementById('history-table').addEventListener('vsc-select', (e) => {
            // 選択された履歴の差分を要求する通信
            vscode.postMessage({ command: 'showDiff', data: e.detail });
        });

        document.getElementById('commit-btn').addEventListener('click', () => {
            vscode.postMessage({ command: 'commitDiff' });
        });
    </script>
</body>
</html>
