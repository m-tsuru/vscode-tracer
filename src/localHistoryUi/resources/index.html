<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src ${cspSource} 'unsafe-inline'; script-src ${cspSource} 'unsafe-inline' 'unsafe-eval' blob:; worker-src ${cspSource} blob:; font-src ${cspSource} data:;">
    <link rel="stylesheet" href="${styleUri}">
</head>
<body>

    <div class="container">
        <aside class="history-panel">
            <header>
                <span id="panel-title">ローカル履歴</span>
                <div class="header-actions">
                    <vscode-button appearance="icon" aria-label="Refresh" id="refresh-btn">
                        <span class="codicon codicon-refresh"></span>
                    </vscode-button>
                </div>
            </header>

            <vscode-table id="history-table" zebra responsive>
                <vscode-table-header slot="header">
                    <vscode-table-header-cell></vscode-table-header-cell>
                    <vscode-table-header-cell>SOURCE</vscode-table-header-cell>
                    <vscode-table-header-cell>CREATE DATE</vscode-table-header-cell>
                    <vscode-table-header-cell>DIFF SIZE</vscode-table-header-cell>
                    <vscode-table-header-cell>Open</vscode-table-header-cell>
                </vscode-table-header>
                <vscode-table-body id="history-table-body">
                    <!-- 履歴エントリはJavaScriptで動的に生成 -->
                </vscode-table-body>
            </vscode-table>

            <footer class="history-footer">
                <div class="diff-stats" id="diff-stats">
                    <span class="additions">+0</span>
                    <span class="deletions">-0</span>
                </div>
                <vscode-button id="stage-btn" appearance="primary" disabled>
                    選択した差分をコミット
                </vscode-button>
            </footer>
        </aside>

        <div class="resizer" id="resizer"></div>

        <main class="diff-viewer">
            <header>
                <span>差分プレビュー: <code id="diff-filename">-</code></span>
                <div class="header-actions">
                    <vscode-button id="open-vscode-diff-btn" appearance="secondary">
                        VS Code Diff で開く
                    </vscode-button>
                </div>
            </header>

            <div class="diff-content">
                <div id="diff-editor"></div>
            </div>
        </main>
    </div>

    <script src="${monacoLoaderUri}"></script>
    <script type="module" src="${toolkitUri}"></script>
    <script>
        // Monaco Editor のパスを設定
        require.config({ paths: { vs: '${monacoBaseUri}/min/vs' } });
    </script>
    <script src="${scriptUri}"></script>
</body>
</html>
