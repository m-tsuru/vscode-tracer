<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src ${cspSource} 'unsafe-inline'; script-src ${cspSource} 'unsafe-inline' 'unsafe-eval' blob:; worker-src ${cspSource} blob:; font-src ${cspSource} data:;">
    <link rel="stylesheet" href="${styleUri}">
</head>
<body>

    <div class="container">
        <aside class="history-panel">
            <header>
                <span>ローカル履歴</span>
                <vscode-button appearance="icon" aria-label="Refresh">
                    <vscode-icon name="refresh"></vscode-icon>
                </vscode-button>
            </header>

            <vscode-table id="history-table">
                <vscode-table-header slot="header">
                    <vscode-table-header-cell>
                        <vscode-checkbox id="select-all"></vscode-checkbox>
                    </vscode-table-header-cell>
                    <vscode-table-header-cell>SOURCE</vscode-table-header-cell>
                    <vscode-table-header-cell>CREATE DATE</vscode-table-header-cell>
                    <vscode-table-header-cell>DIFF SIZE</vscode-table-header-cell>
                    <vscode-table-header-cell>Open</vscode-table-header-cell>
                </vscode-table-header>
                <vscode-table-body>
                    <vscode-table-row>
                        <vscode-table-cell>
                            <vscode-checkbox id="select"></vscode-checkbox>
                        </vscode-table-cell>
                        <vscode-table-cell>&ndash;</vscode-table-cell>
                        <vscode-table-cell>2024/05/20 14:30</vscode-table-cell>
                        <vscode-table-cell>+12 -5</vscode-table-cell>
                        <vscode-table-cell>
                            <vscode-button appearance="icon" aria-label="Open">
                                <vscode-icon name="eye"></vscode-icon>
                            </vscode-button>
                        </vscode-table-cell>
                    </vscode-table-row>
                    <vscode-table-row>
                        <vscode-table-cell>
                            <vscode-checkbox id="select"></vscode-checkbox>
                        </vscode-table-cell>
                        <vscode-table-cell>&ndash;</vscode-table-cell>
                        <vscode-table-cell>2024/05/20 14:30</vscode-table-cell>
                        <vscode-table-cell>+12 -5</vscode-table-cell>
                        <vscode-table-cell>
                            <vscode-button appearance="icon" aria-label="Open">
                                <vscode-icon name="eye"></vscode-icon>
                            </vscode-button>
                        </vscode-table-cell>
                    </vscode-table-row>
                </vscode-table-body>
            </vscode-table>
        </aside>

        <div class="resizer" id="resizer"></div>

        <main class="diff-viewer">
            <header>
                <span>差分プレビュー: <code id="diff-filename">extension.ts</code></span>
                <vscode-button id="commit-btn" appearance="primary">
                    この差分のみステージ
                </vscode-button>
            </header>

            <div class="diff-content">
                <div id="diff-editor"></div>
            </div>
        </main>
    </div>

    <script src="${monacoLoaderUri}"></script>
    <script type="module" src="${toolkitUri}"></script>
    <script>
        // Monaco Editor のパスを設定
        require.config({ paths: { vs: '${monacoBaseUri}/min/vs' } });
    </script>
    <script src="${scriptUri}"></script>
</body>
</html>
